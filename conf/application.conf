# Configuration

# Secret key
# ~~~~~
# The secret key is used to secure cryptographic functions.
# Never commit a real secret: provide it via the APPLICATION_SECRET
# environment variable in production. In dev/test mode Play falls back to
# a generated dev secret.
play.http.secret.key = ${?APPLICATION_SECRET}

play.modules.enabled += "bootstrap.PropertiesDatabaseModule"

# Database configuration
# ~~~~~
# You can declare as many datasources as you want.
# By convention, the default datasource is named `default`
slick.dbs.default.profile = "slick.jdbc.H2Profile$"
slick.dbs.default.db.driver = "org.h2.Driver"
slick.dbs.default.db.url = "jdbc:h2:mem:play"
slick.dbs.default.db.user = sa
slick.dbs.default.db.password = ""

# Assets configuration
# ~~~~~
"assets.cache./public/stylesheets/bootstrap.min.css" = "max-age=3600"
